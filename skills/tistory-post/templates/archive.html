<!-- (1) 발표 자료 공유형 -->
<h2 style="box-sizing: border-box; border-right-width: 0px; border-top-width: 0px; border-left: #43587F 6px solid; border-bottom: #e0e0e0 2px solid; line-height: 1.5; margin-right: 0px; padding: 3px 5px 3px 10px;" data-ke-size="size26">1. {발표 제목}</h2>
<p data-ke-size="size16">일시 : {YY.MM.DD (요일)}</p>
<p data-ke-size="size16">대상 : {회사 팀}</p>
<p data-ke-size="size16">개요 : {한 줄 개요}</p>
<p data-ke-size="size16">[자료 첨부: 구글 슬라이드 자료 / PDF 자료]</p>
<p data-ke-size="size16">&nbsp;</p>
<!-- (2) 좋은 글 모음형 -->
<h2 style="box-sizing: border-box; border-right-width: 0px; border-top-width: 0px; border-left: #43587F 6px solid; border-bottom: #e0e0e0 2px solid; line-height: 1.5; margin-right: 0px; padding: 3px 5px 3px 10px;" data-ke-size="size26">{Non-Tech 관련}</h2>
<p data-ke-size="size16"><b>{소분류}</b></p>
<ul style="list-style-type: disc;" data-ke-list-type="disc">
<li><a href="{url}" target="_blank" rel="noopener">{글 제목}</a> : {한 줄 평}</li>
</ul>
<p data-ke-size="size16">&nbsp;</p>
